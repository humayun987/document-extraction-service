version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: outcome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: outcome_extraction
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d outcome_extraction"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outcome-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      - SERVICE_PORT=8080
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/outcome_extraction
      - STORAGE_DIR=/app/storage/uploads
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - MAX_UPLOAD_SIZE=52428800
      - MAX_DOCUMENT_PROCESSING_TIME=1800
      - EXPECTED_CONCURRENT_DOCUMENTS=10
    volumes:
      - shared_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/outcome_extraction
      - STORAGE_DIR=/app/storage/uploads
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - WORKER_LEASE_SECONDS=60
      - WORKER_POLL_INTERVAL=1.0
    volumes:
      - shared_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
  shared_storage:
