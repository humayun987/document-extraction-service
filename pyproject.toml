[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "outcome-document-extraction"
version = "1.0.0"
description = "Outcome Take-Home Assignment: Document Extraction Service"
authors = [{ name = "Humayun Ahmad", email = "humayuna23@iitk.ac.in" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "pytesseract>=0.3.10",
    "pillow>=10.2.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
